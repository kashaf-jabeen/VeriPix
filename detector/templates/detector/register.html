<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VeriPix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background-color: #111827; border-bottom: 1px solid #1f2937; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 18px; }
        .form-control { background-color: #1f2937; border: 1px solid #374151; color: white; }
        .form-control:focus { background-color: #1f2937; border-color: #3b82f6; color: white; box-shadow: none; }
        footer { background-color: #111827; border-top: 1px solid #1f2937; margin-top: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold text-primary fs-3" href="/"><i class="fa-solid fa-shield-halved me-2"></i>VeriPix</a>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-lg">
                    <h4 class="fw-bold text-light mb-1">Create Account</h4>
                    <p class="text-secondary small mb-4">Get unlimited access to AI forensic tools</p>

                    <form method="POST">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label text-secondary small">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" class="form-control" required>
                            {% if field.errors %}
                            <span class="text-danger small">{{ field.errors.0 }}</span>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2 py-2">Create Account</button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-secondary small">Already have an account? <a href="/login/" class="text-primary text-decoration-none">Log In</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-3 px-4 text-center text-secondary small">
        <span class="fw-bold text-primary">VeriPix</span> &copy; 2026 AI Image Forensic Detector
    </footer>
</body>
</html>
